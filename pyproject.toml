[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sewerpipe-inspector-desktop"
version = "0.1.0"
description = "Offline desktop tool for sewer CCTV defect inspection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "SQLAlchemy>=2.0.35",
  "alembic>=1.13.3",
  "pydantic-settings>=2.6.0",
  "cryptography>=43.0.1",
  "httpx>=0.27.2",
  "PySide6>=6.7.0",
  "opencv-python>=4.10.0.84",
  "openpyxl>=3.1.5",
  "Pillow>=10.4.0",
  "pytesseract>=0.3.10",
  "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]
server = [
  "uvicorn[standard]>=0.32.0",
  "psycopg[binary]>=3.2.0",
]

[project.scripts]
pipe1-admin = "pipe1_license_server.admin_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
