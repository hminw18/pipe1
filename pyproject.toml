[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sewerpipe-inspector-desktop"
version = "0.1.1"
description = "Offline desktop tool for sewer CCTV defect inspection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0.1",
  "httpx>=0.27.2",
  "PySide6>=6.7.0",
  "opencv-python>=4.10.0.84",
  "openpyxl>=3.1.5",
  "Pillow>=10.4.0",
  "pypdf>=4.3.1",
  "pytesseract>=0.3.10",
  "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
