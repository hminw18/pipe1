[project]
name = "pipe1-core"
version = "0.1.0"
description = "Qt-free Pipe1 inspection core: defect taxonomy, grading, stop detection, Excel/PDF reports"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10.0.84",
  "openpyxl>=3.1.5",
  "Pillow>=10.4.0",
  "pytesseract>=0.3.10",
  "reportlab>=4.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
