[project]
name = "pipe1-server"
version = "0.1.0"
description = "Pipe1 web backend (FastAPI)"
readme = "README.md"
authors = [
    { name = "Minwoo", email = "hminw18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "google-auth>=2.62.0",
    "google-cloud-kms>=3.18.0",
    "google-cloud-storage>=3.17.1",
    "google-cloud-tasks>=2.26.0",
    "httpx2>=2.16.0",
    "pipe1-core[ocr]>=0.1.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyotp>=2.10.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated table definitions; long lines are expected.
"migrations/versions/*.py" = ["E501"]

[tool.uv.sources]
pipe1-core = { path = "../core", editable = true }
